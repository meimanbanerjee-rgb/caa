# InsightForge AI - Docker Compose Configuration
# Runs both the FastAPI backend and the React frontend in containers.

version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: insightforge-backend
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gemini-1.5-flash}
      - DATABASE_URL=sqlite:///./insightforge.db
      - MAX_UPLOAD_MB=25
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:80
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: insightforge-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
